name: 배포
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # 🔴 밸런스 게이트를 CI에 둔다.
      #    "정답률 60% 아이가 캠페인을 소환 없이 통과한다"(G2)를 실측 검증하는 유일한 장치인데,
      #    예전엔 npm run check(로컬 전용)에만 물려 있었다. 그래서 셈력 상한·배속·대포처럼
      #    바로 이 게이트가 감시해야 할 상수를 바꾸고도 CI를 통과해 배포될 수 있었다.
      #    parity 테스트는 "TS와 프로브 수식이 서로 같다"만 보장한다 — 다른 질문이다.
      #    ⚠️ 2026-07-31: 아래 스프라이트 게이트를 끼워 넣으면서 이 `- run:` 줄을 실수로 지우고
      #       주석만 남긴 채 푸시했다. CI 스텝 목록에 프로브가 없는 걸 보고 되살렸다.
      #       주석은 게이트가 아니다 — 스텝 목록을 눈으로 확인할 것.
      - run: node tools/balance-probe.mjs
      # 🔴 스프라이트 알파 게이트도 CI에 둔다. **이미 한 번 일어난 사고**를 막는 장치다 —
      #    배경 제거 단계가 스프라이트 6개를 조용히 갉아먹은 채 배포됐고, 비율 지표가
      #    "살아남은 것만" 재고 있어서 전량 삭제를 못 봤다. 그런데 정작 게이트는
      #    npm run check(로컬 전용)에만 물려 있어, 로컬에서 안 돌리면 그대로 나갔다.
      #    🔴 검사 대상은 `_raw` 가 아니라 **실제로 배포되는 public/assets** 다.
      #       (_raw 는 커밋되지 않으므로 CI에서 검사하면 파일 0개로 통과해 버린다 —
      #        안 도는 것보다 도는 척하는 쪽이 더 나쁘다.) 게다가 이렇게 두면
      #        빌드 단계가 망가뜨린 경우까지 잡힌다 — 지난 사고가 정확히 그랬다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy pillow
      - run: node tools/asset-check.mjs public/assets
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 🔴 **학생이 실제로 여는 주소는 여기다.**
  #
  #    2026-08-21 에 배포를 Cloudflare Pages 로 옮겼다(교육청 네트워크가 `github.io` 를
  #    도메인째 막는다). 그런데 **파이프라인은 이사를 안 갔다** — CI 는 계속 github.io 로만
  #    나가고, `gugu-guardians.pages.dev` 는 누가 `wrangler pages deploy` 를 손으로 쳐야만
  #    갱신됐다(`wrangler pages project list` → Git Provider: No).
  #
  #    결과: 다음 날 푸시한 변경이 CI 초록불을 받고도 **학생에게는 도달하지 않았다.**
  #    두 주소의 번들 해시가 서로 달랐다(2026-08-22 실측). 초록불이 거짓말을 한 것이다.
  #
  #    🔴 손으로 치는 걸 기억해야 하는 구조는 반드시 잊힌다. 그래서 CI 에 넣는다.
  #    github.io 배포는 **일부러 남긴다** — 기존 링크가 깨지지 않도록.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    # 시크릿이 없으면 조용히 실패하지 말고 **건너뛴다**(로그에 이유가 남는다).
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # 🔴 **시크릿이 없으면 실패한다 — 경고로 넘어가지 않는다.**
      #    예전엔 `::warning::` 를 찍고 `ok=false` 로 건너뛰었다. 경고는 잡을 실패시키지
      #    않으므로 **잡도 워크플로도 초록**이었다. 그래서 2026-08-22 이후 학생이 여는
      #    pages.dev 는 8/22 빌드에 멈춘 채로, 2판 난이도 완화도 재도전 3회도 도달하지
      #    못했다 — 그동안 푸시마다 초록불이 떴다(2026-08-28 실측: 배포 번들에 신규
      #    유닛 문자열 0건, github.io 에는 1건).
      #    「건너뛰되 로그에 남긴다」는 사람이 로그를 읽을 때만 작동한다. 안 읽힌다.
      - name: 시크릿 확인
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID 가 없어 학생 사이트(pages.dev)에 배포하지 못했습니다. 저장소 Settings → Secrets and variables → Actions 에 두 값을 넣으세요(계정 ID 는 gugu-guardians Pages 프로젝트를 가진 계정의 것). 임시로는 'npx wrangler pages deploy dist --project-name gugu-guardians --branch main'."
            exit 1
          fi
      - name: Cloudflare Pages 배포 (학생이 여는 주소)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name gugu-guardians --branch main
      # 🔴 **배포했다는 말을 믿지 않고, 학생 주소를 실제로 열어 본다.**
      #    「배포 성공」은 업로드가 됐다는 뜻이지 그 주소가 새 번들을 준다는 뜻이 아니다.
      #    오늘 고친 결함이 정확히 그 틈이었다. 방금 빌드한 번들 파일명이 pages.dev 의
      #    index.html 에 보이는지 확인한다 — 안 보이면 배포는 실패한 것이다.
      - name: 학생 주소가 방금 만든 번들을 주는지 확인
        run: |
          want=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "이번 빌드 번들: $want"
          for i in 1 2 3 4 5 6; do
            got=$(curl -sf "https://gugu-guardians.pages.dev/?cb=$RANDOM$i" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            echo "  시도 $i — 학생 주소: ${got:-(응답 없음)}"
            [ "$got" = "$want" ] && exit 0
            sleep 10
          done
          echo "::error::학생 주소(gugu-guardians.pages.dev)가 아직 옛 번들을 주고 있습니다. 배포 잡은 성공했지만 학생에게는 도달하지 않았습니다."
          exit 1
